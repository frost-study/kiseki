<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kiseki Chart: trade markers</title>
    <style>
      body { margin: 0; background: #f5f2eb; color: #3a3732; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      main { max-width: 960px; margin: 0 auto; padding: 20px 16px 32px; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p { margin: 0 0 12px; color: #77726a; }
      #chart { height: 440px; border: 1px solid #d9d3c6; }
      #log { margin-top: 10px; min-height: 1.6em; font: 12px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </head>
  <body>
    <main>
      <h1>Trade markers</h1>
      <p>
        Entries and exits at their exact time and price: a ring where the fill happened, an arrow beside the bar, and a line from
        entry to exit in the color of the result. All data here is synthetic.
      </p>
      <div id="chart"></div>
      <div id="log">Point at a marker for the details. Click one to bring the whole trade into view.</div>
    </main>
    <script type="module">
      import { Chart, DemoFeed, sampleTrades } from '../src/index.js';

      const utcOffset = -new Date().getTimezoneOffset() * 60_000;
      const feed = new DemoFeed({ utcOffset });
      const data = await feed.history('FABLE', '1h');
      const n = data.length;

      const chart = new Chart(document.getElementById('chart'), { theme: 'light', utcOffset });
      chart.setSymbol({ name: 'FABLE', precision: 0 }, '1 hour');
      chart.setData(data);

      // Round trips: an entry, an exit, and the result between them. One without an exit is still open.
      chart.trades.set(sampleTrades(data, { precision: 0, fast: 5, slow: 15 }));

      // A single fill needs only a time, a price and a side. The time can fall anywhere inside a bar.
      chart.trades.add({
        time: data.time[n - 30] + 20 * 60_000,
        price: data.low[n - 30],
        side: 'buy',
        qty: 100,
        label: 'Dip buy',
        note: 'Any text of your own',
      });

      // A level of your own, kept inside the price range.
      chart.addPriceLine({ price: Math.round(data.close[n - 1] * 1.04), title: 'Target', color: 'accent', autoscale: true });

      const log = document.getElementById('log');
      chart.on('trade:hover', (e) => {
        log.textContent = e ? `${e.side} · ${JSON.stringify(e.items[0])}` : 'Point at a marker for the details. Click one to bring the whole trade into view.';
      });
      chart.on('trade:click', (e) => chart.trades.reveal(e.items[0]));

      window.chart = chart;
    </script>
  </body>
</html>

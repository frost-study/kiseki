<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kiseki widget</title>
    <style>
      html, body { height: 100%; margin: 0; background: transparent; }
      body > :not(script) { display: block; height: 100%; }
    </style>
  </head>
  <body>
    <!--
      Page for iframes. With ?widget=price-card&symbol=FABLE&range=1M&theme=dark it shows that one widget
      filling the viewport. Use it on pages where scripts are not allowed (a CMS, for example):
        <iframe src="…/embed.html?widget=price-card&symbol=FABLE" width="320" height="212" style="border:0"></iframe>
    -->
    <script type="module">
      import { WIDGETS } from './embed.js';

      const params = new URLSearchParams(location.search);
      const widget = WIDGETS.find((w) => w.id === params.get('widget')) ?? WIDGETS.find((w) => w.id === 'price-card');
      const el = document.createElement(widget.tag);
      // pass only known attributes (never turn arbitrary URL values into attributes)
      for (const name of widget.attributes) if (params.has(name)) el.setAttribute(name, params.get(name));
      if (params.get('lang')) document.documentElement.lang = params.get('lang');
      document.body.append(el);
    </script>
  </body>
</html>

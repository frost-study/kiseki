name: Pages

# Publishes the demo (the chart, the widget gallery, the examples and the benchmark) to GitHub Pages.
# There is no build step: the site is the repository's static files, minus tests and tools.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Collect the site
        run: |
          mkdir _site
          cp -R index.html widgets.html bench.html embed.html embed.js src examples docs LICENSE _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Deploying in a job of its own gives the artifact time to show up in the run's artifact list. Right after an upload in the
  # same job, deploy-pages can find nothing ("No artifacts named github-pages", actions/deploy-pages#451), so a failed
  # first attempt is also retried once after a pause. Re-running a failed run does not help: it uploads a second artifact.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.second.outputs.page_url }}
    steps:
      - id: first
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.first.outcome == 'failure'
        run: sleep 30
      - id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5

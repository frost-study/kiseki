name: Pages

# Publishes the demo (the chart, the widget gallery, the examples and the benchmark) to GitHub Pages.
# There is no build step: the site is the repository's static files, minus tests and tools.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Collect the site
        run: |
          mkdir _site
          cp -R index.html widgets.html bench.html embed.html embed.js src examples docs LICENSE _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
